version: '3'

# z-Bot unified tasks. Prerequisites: Go 1.26+, Task (taskfile.dev), Node
# (for contract tooling via npx), golangci-lint. Plain `go` commands also
# work — these tasks are thin wrappers over the Go toolchain.

vars:
  GO_PACKAGES: './...'
  CONTRACT: contracts/openapi.yaml
  # The chitta memory capability embeds LadybugDB via cgo (vendored at
  # backend/third_party/go-ladybug — run its download_lbug.sh once after
  # cloning; see backend/chitta/AGENTS.md). All backend build/test/lint
  # tasks therefore run with CGO_ENABLED=1.
  CGO: 'CGO_ENABLED=1'

tasks:
  build:
    desc: Build all backend packages
    dir: backend
    cmds:
      - "{{.CGO}} go build {{.GO_PACKAGES}}"

  test:
    desc: Run all backend tests (race detector on)
    aliases: [test:backend]
    dir: backend
    cmds:
      - "{{.CGO}} go test -race {{.GO_PACKAGES}}"

  test:chitta:ladybug:
    desc: Run the chitta suite against the real LadybugDB driver
    dir: backend
    cmds:
      - "{{.CGO}} CHITTA_DRIVER=ladybug go test -race ./chitta/ -timeout 600s"

  lint:
    desc: Vet and gofmt-check the backend
    dir: backend
    cmds:
      - "{{.CGO}} go vet {{.GO_PACKAGES}}"
      - test -z "$(gofmt -l .)" || { gofmt -l .; echo 'gofmt needed - run task fmt'; exit 1; }

  lint:backend:
    desc: golangci-lint over the backend (constitution Verification)
    dir: backend
    cmds:
      - "{{.CGO}} golangci-lint run ./..."

  gates:backend:
    desc: Mechanical go-rules.md gates (LOC budget, names, ctx, boundaries, docs, contract drift)
    cmds:
      - scripts/backend-gates.sh

  budget:backend:
    desc: Suite runtime budget gate (go-rules.md 4.3, machine-qualified)
    cmds:
      - scripts/backend-gates.sh --budget

  fmt:
    desc: Format the backend
    dir: backend
    cmds:
      - gofmt -w .

  setup:chitta:
    desc: Vendor LadybugDB extensions + warm the fastembed model cache (once per machine; daemon never downloads at runtime)
    dir: backend
    cmds:
      - "{{.CGO}} go run ./tools/lbug-setup"
      - |
        # Warm the fastembed model cache (downloads bge-small-en-v1.5 once).
        {{.CGO}} go run ./tools/embed-setup || echo "embed model warm-up skipped (optional)"

  test:chitta:recall:
    desc: Golden recall evaluation with floors (nDCG@10, MRR@10)
    dir: backend
    cmds:
      - "{{.CGO}} go test ./chitta/internal/recalleval/ -v -timeout 300s"

  codegen:
    desc: Validate the API contract and regenerate clients (always runs validation)
    cmds:
      # Always: validate the contract (fails the task on any error).
      - npx --yes @redocly/cli lint --format summary {{.CONTRACT}}
      # Frontend TS client: only once frontend/package.json exists.
      - |
        if [ -f frontend/package.json ]; then
          cd frontend && npx --yes openapi-typescript ../{{.CONTRACT}} \
            --output src/shared/api/schema.d.ts
        else
          echo "frontend/ not scaffolded yet - skipping client generation"
        fi
      # Go server types (design D5 of add-openai-compatible-providers):
      # oapi-codegen via the backend module's tool directive; output committed.
      - |
        cd backend && go tool oapi-codegen \
          --config internal/server/apigen/oapi-codegen.yaml \
          ../{{.CONTRACT}}

  dev:
    desc: Start the frontend-only workspace preview
    dir: frontend
    cmds:
      - pnpm dev

  dev:backend:
    desc: Live-reload zbotd (air) — edit Go, daemon restarts on :8787
    dir: backend
    env:
      CGO_ENABLED: "1"
    cmds:
      - air -c .air.toml

  dev:all:
    desc: Dev stack — Vite HMR on :9245 + live-reloading zbotd on :8787 (Ctrl-C stops both)
    cmds:
      - |
        cleanup() { kill 0 2>/dev/null || true; }
        trap cleanup EXIT INT TERM
        (cd frontend && pnpm dev) &
        (cd backend && CGO_ENABLED=1 air -c .air.toml) &
        wait

  check:frontend:
    desc: Check Svelte and TypeScript and build the static SPA
    dir: frontend
    cmds:
      - pnpm check
      - pnpm build

  test:frontend:
    desc: Run offline Chromium shell interaction tests
    dir: frontend
    cmds:
      - pnpm test

  verify:
    desc: End-to-end check - codegen, gates, lint, tests (incl. real LadybugDB driver), build (constitution Verification)
    cmds:
      - task: gates:backend
      - task: codegen
      - task: lint
      - task: lint:backend
      - task: test
      - task: budget:backend
      - task: test:chitta:ladybug
      - task: build
      - task: check:frontend
      - task: test:frontend
