openapi: 3.1.0
info:
  title: z-Bot Daemon API
  version: 0.2.0
  description: |
    The local-first HTTP/SSE contract between the zbotd daemon and its
    clients (web UI, Wails desktop shell, Bubbletea CLI, future channels).
    Single source of truth: handlers and clients are generated from this
    file. Evolution is additive within a major version.
servers:
  - url: http://127.0.0.1:8787
    description: Local daemon (loopback only)

# z-Bot is local-first: the daemon binds loopback by default and
# requires no authentication. An operator may expose a wildcard/LAN bind
# (config server.address) — an explicit trust decision that puts the
# unauthenticated API on the network and adapts the request guard
# accordingly (see backend/internal/server/guard.go).
security: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: The daemon is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/providers:
    get:
      operationId: listProviders
      summary: List configured model providers
      description: |
        Providers resolved from `config.yaml` (origin `config`) and
        `config/providers/*.yaml` (origin `file`) at load and on change.
        Responses carry the credential env-var NAME and status — never a
        credential value.
      responses:
        '200':
          description: The configured providers (empty list when none are
            configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
    post:
      operationId: createProvider
      summary: Create a provider (daemon-managed file)
      description: |
        Writes `config/providers/<name>.yaml`. The optional credential
        object either references an environment variable or stores a
        one-shot API key in the platform keyring; the key value appears
        in no response, file, or log. Applies immediately — no restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
      responses:
        '201':
          description: Created; the provider is listed and usable now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate name, full provider list, or origin-
            protected provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The platform keyring is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/providers/{name}:
    patch:
      operationId: updateProvider
      summary: Edit a daemon-managed provider
      description: |
        Rewrites the provider's file. Absent fields keep their current
        values; a present `credential` object replaces or clears the
        credential. Rename removes the old file and re-keys the keyring
        item. Origin-protected (config.yaml) providers are refused.
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '200':
          description: Updated; immediately visible in listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target-name conflict or origin-protected provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The platform keyring is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteProvider
      summary: Delete a daemon-managed provider
      description: |
        Removes the provider's file and deletes its keyring item
        best-effort (a failed secret cleanup does not block the delete).
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Origin-protected provider (declared in config.yaml).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/providers/{name}/models:
    get:
      operationId: listProviderModels
      summary: Discover a provider's models through the daemon
      description: |
        Proxies OpenAI-compatible model discovery: the daemon calls the
        provider's `{base_url}/models` endpoint (with the referenced
        credential, when configured) and returns the discovered model
        identifiers. The client never contacts the provider directly.
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      responses:
        '200':
          description: The provider's discovered models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderFailure'

  /api/models:
    get:
      operationId: listModels
      summary: Read the daemon's model catalog
      description: |
        Every catalogued model across providers (flat `provider` + `id`
        entries) with each provider's last refresh timestamp. Served from
        memory — this endpoint never contacts a provider. Manual-refresh
        catalog: empty until a provider is refreshed or tested.
      responses:
        '200':
          description: The catalog (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'

  /api/schedules:
    get:
      operationId: listSchedules
      summary: List configured schedules
      description: |
        Every schedule from the registry snapshot (config/schedules),
        ordered by name, each with its next fire time and the scheduler's
        last recorded decision. Broken hand edits surface via the
        registry's load-error surface.
      responses:
        '200':
          description: The schedule roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'
    post:
      operationId: createSchedule
      summary: Create a schedule
      description: |
        Installs a schedule definition atomically. Invalid cron
        expressions, names, or shapes are typed 400s naming the cause;
        nothing is written on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '200':
          description: The created schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/schedules/{name}:
    get:
      operationId: getSchedule
      summary: Read one schedule
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateSchedule
      summary: Update a schedule (rename-aware)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Deletion confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDeleted'

  /api/agents:
    get:
      operationId: listAgents
      summary: List configured agents
      description: |
        Every agent definition loaded from ~/.zbot/agents (the registry
        snapshot), ordered by name: name, optional display name,
        when-to-delegate description, optional model override, tool
        allowlist, and delegation grant (max_depth). Read-only — agents
        are file-defined and user-owned; broken hand edits surface via
        the registry's load-error surface, and entries that do not load
        are absent here.
      responses:
        '200':
          description: The agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'

  /api/wards:
    get:
      operationId: listWards
      summary: List vault wards
      description: |
        Every ward directory in the ward vault (default ~/Documents/wards,
        or the config `wards.vault_root` override — wards are user data
        outside ~/.zbot), ordered by name: archetype, lint summary, and
        the canonical page title when a canonical page exists.
        Conf-less wards are valid freeform wards (archetype `generic`);
        a ward whose ward-conf.yaml fails to parse lists with archetype
        `unknown` and its findings carry the parse error. Read-only in
        v1 — wards are created by agents (a later slice) or by hand;
        the daemon never writes user files. The response also carries
        the resolved vault root (the UI empty state points at it).
      responses:
        '200':
          description: The ward roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardList'
        '500':
          description: Vault I/O failure (indexed mid-scan, permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The ward vault is not wired (daemon wiring failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/wards/{name}:
    get:
      operationId: getWard
      summary: Read one ward (layout tree + lint findings)
      description: |
        One ward's detail: the parsed ward-conf.yaml layout tree (node
        ids, kinds, matches — `layout` is absent for conf-less or
        unparseable-conffed wards) plus the full lint findings. These
        node ids are the same ids the ward tool will inject as the
        Active Ward Template (slice 3).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: The ward detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ward'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Vault I/O failure (indexed mid-scan, permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The ward vault is not wired (daemon wiring failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/wards/{name}/warden:
    post:
      operationId: ensureWarden
      summary: Ensure the ward's persistent session (the warden)
      description: |
        Every ward has a warden: its persistent home conversation (a
        research session, id `ward-<name>`, ward-bound). Idempotent —
        creates on first select, returns the existing one after. The
        sidebar's ward rows select wardens.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: The warden session (existing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '201':
          description: The warden session (freshly created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The ward vault is not wired (daemon wiring failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mcps:
    get:
      operationId: listMcps
      summary: List registered MCP servers
      description: |
        Every registered MCP server from the registry snapshot, with each
        server's declared transports (stdio command/args/env and/or
        streamable-http url) and its manifest file. `load_errors` carries
        per-file registry failures (broken hand edits) naming their paths;
        entries whose files do not load are absent from `servers`. Lists are
        complete within the per-kind capacity; hand-edited overflow surfaces
        as load errors. Env values are the file content the user authored —
        the daemon adds no secrets.
      responses:
        '200':
          description: The registered servers (empty list when none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpList'
    post:
      operationId: createMcp
      summary: Create an MCP server (managed manifest file)
      description: |
        Writes `config/mcps/<name>.yaml`. The body is the complete
        manifest: stdio (`command` + optional `args`/`env`) and/or
        streamable-http (`url`); at least one transport is required.
        Managed names only (`^[a-z0-9][a-z0-9-]{0,63}$`, no
        Windows-reserved). Applies immediately via the registry — no
        restart. No-clobber: a target path occupied on disk (valid,
        invalid, or in the watcher window) fails with `duplicate_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpCreate'
      responses:
        '201':
          description: Created; the server is listed now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate name or occupied target path
            (`duplicate_name`), or the per-kind capacity is full
            (`mcp_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/skills/marketplace/search:
    get:
      operationId: searchSkillMarketplace
      summary: Search the open skills.sh directory (daemon-proxied)
      description: |
        Proxies the pinned skills.sh index at the user's explicit
        action. Results carry each skill's slug (`owner/repo/skill`),
        source repo, name, and install count. Five-minute cache:
        fresh cache serves, expired re-queries synchronously, no
        background refresh. Typed index-unreachable failure; never
        fabricated results.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Search results (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMarketSearchResult'
        '502':
          description: The skills.sh index is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/skills/marketplace/preview:
    post:
      operationId: previewSkillSource
      summary: Preview skills in a GitHub repository (byte-binding)
      description: |
        Resolves the repository's default branch to an IMMUTABLE commit,
        fetches the tarball at that commit under the shared safety
        envelope, detects skill folders (skills/*/, .agents/skills/*/,
        root SKILL.md, single-directory), and returns each skill's
        parsed SKILL.md, complete file list with sizes, license when
        present, the pinned commit, and an opaque preview CAPABILITY
        binding repo + commit + skill paths + per-file digests.
        Installs consume the capability; there is no install without a
        preview. A pasted source parses to a canonical GitHub
        owner/repo identity — never an arbitrary fetch destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillSourceInput'
      responses:
        '200':
          description: Repository preview with per-skill payloads and
            the install capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRepoPreview'
        '400':
          description: Malformed source identity or archive/skill
            validation failure naming the violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GitHub unreachable or rate-limited (retry
            guidance in the message), or no valid skills found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/skills/marketplace/install:
    post:
      operationId: installSkillCapability
      summary: Install previewed skills by capability
      description: |
        Consumes a preview capability for the chosen skill subset —
        never arbitrary source/ref inputs. On capability cache expiry
        the daemon re-fetches the PINNED commit and verifies per-file
        digests; any mismatch is a typed changed-upstream failure. One
        outcome per chosen skill (created / skipped-duplicate /
        failed), processed independently like the MCP import. Nothing
        executes at install.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInstallRequest'
      responses:
        '200':
          description: One outcome per chosen skill, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInstallResult'
        '400':
          description: Unknown/malformed capability or empty subset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expired or already-consumed capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream fetch failed, rate-limited, or content
            changed upstream (re-preview guidance in the message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/skills/import/preview:
    post:
      operationId: previewSkillArchive
      summary: Preview and stage a .skill/.zip archive (multipart)
      description: |
        The ONLY endpoint exempt from the JSON-mutation rule: accepts
        multipart/form-data with EXACTLY one file part named `archive`
        (no other parts; body ≤ 10 MiB enforced before parsing),
        protected by trusted-Host plus Origin enforcement. Parses under
        the shared safety envelope (50 MiB uncompressed, 512 entries,
        streaming re-enforcement, regular files/dirs only, path
        validator; SKILL.md at root or exactly one top-level
        directory; the reserved `.karta/provenance.yaml` path rejects).
        Stages server-side and returns the staging id with the same
        preview payload. Violations are typed 400s naming the reason.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                  description: The .skill or .zip file (≤10 MiB).
      responses:
        '200':
          description: Staged preview (commit by staging id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillArchivePreview'
        '400':
          description: Archive violation naming the reason (traversal,
            symlink, caps, corrupt, no SKILL.md, extra parts, reserved
            path) or the busy bound exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body over the pre-parse size bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/skills/import/commit:
    post:
      operationId: commitSkillArchive
      summary: Install a staged archive by its capability
      description: |
        Commits a staged preview by its opaque one-shot bearer id.
        Expiry is checked synchronously; replays and unknown ids 404;
        the skill installs with origin `import` and provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillImportCommitRequest'
      responses:
        '200':
          description: The installed skill detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInstallOutcome'
        '404':
          description: Unknown, expired, or already-consumed staging id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/mcps/import:
    post:
      operationId: importMcps
      summary: Import MCP servers from standard JSON (raw paste)
      description: |
        Imports standard `mcpServers` JSON (modelcontextprotocol.io
        quickstart shape; `servers` alias, bare map, and single-object
        pastes accepted). The paste travels as RAW TEXT in `document` —
        the daemon is the only parser: entries process in paste order,
        numeric env literals coerce from their exact source text, and
        duplicate keys (Unicode-escaped equivalents included) reject
        the whole document before any write. Every entry gets one
        outcome row; entry failures never fail the request. Duplicate
        detection (existing manifest, occupied target path, or an
        earlier entry of the same paste) outranks capacity; a write
        failure (`io_error`) on one entry never aborts the rest.
        Document-level rejections (400, nothing created): malformed
        JSON, duplicate keys, trailing content, BOM or non-UTF-8 text,
        JSON non-object, unclassifiable shape, no recognizable servers,
        single-object paste without `name`, over 256 KiB, over 32
        entries. `replaceName` is edit-as-JSON: the document must hold
        exactly one entry whose transports replace that server's
        manifest wholesale (name unchanged); a multi-entry document, an
        entry that would skip or fail, or an unknown target rejects
        with the target untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpImportRequest'
      responses:
        '200':
          description: One outcome per entry, in paste order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpImportResult'
        '400':
          description: Document-level rejection (nothing was created)
            or an invalid replace-mode document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Replace mode with an unknown target (the
            document was valid; nothing was changed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/mcps/{name}:
    parameters:
      - $ref: '#/components/parameters/McpName'
    patch:
      operationId: updateMcp
      summary: Edit an MCP server (full replace; rename supported)
      description: |
        Replaces the named server's manifest wholesale (PUT semantics over
        PATCH). An included `name` renames: the new manifest is written
        (no-clobber), published, and the old file removed; a failed old-file
        removal surfaces both files as a duplicate load error and the retry
        is idempotent. Clearing both transports is a 400 — at least one is
        required. Legacy broader-named files are editable in place via
        their loaded source path; renames normalize to managed names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpUpdate'
      responses:
        '200':
          description: The updated server as now registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate target name or occupied target path
            (`duplicate_name`), or capacity (`mcp_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMcp
      summary: Delete an MCP server
      description: |
        Removes the server's manifest file and unregisters it. After a
        failed filesystem commit the published registry state matches disk.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/mcps/{name}/test:
    parameters:
      - $ref: '#/components/parameters/McpName'
    post:
      operationId: testMcp
      summary: Probe an MCP server's declared transports
      description: |
        Runs a real MCP client per declared transport (spawn the stdio
        command with its env; connect the HTTP url) — initialize,
        tools/list, shutdown — concurrently under one shared deadline.
        Returns one result per transport: discovered tools (capped, with
        `truncated` set) or a typed failure. Probe failures are 200 bodies:
        a broken configuration is expected data, not a server error. The
        probe executes no tool and mutates nothing.
      responses:
        '200':
          description: One result per declared transport.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTestResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/skills:
    get:
      operationId: listSkills
      summary: List registered skills
      description: |
        Every registered skill from the registry snapshot with name,
        description, and directory. `load_errors` carries per-file registry
        failures naming their paths; skills whose SKILL.md does not load
        are absent from `skills`.
      responses:
        '200':
          description: The registered skills (empty list when none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
    post:
      operationId: createSkill
      summary: Create a skill (managed directory)
      description: |
        Writes `skills/<slug>/SKILL.md` (top-level root) (slug derived from the
        name, managed-name form). No-clobber: an occupied directory
        fails with `duplicate_name` whatever occupies it. Applies
        immediately — no restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreate'
      responses:
        '201':
          description: Created; the skill is listed now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate skill name or occupied target directory
            (`duplicate_name`), or the per-kind capacity is full
            (`skill_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/skills/{name}:
    parameters:
      - $ref: '#/components/parameters/SkillName'
    get:
      operationId: getSkill
      summary: Read one skill's detail (frontmatter + body)
      description: |
        The skill's name, description, directory, and full SKILL.md body
        as currently loaded. Reading alters nothing.
      responses:
        '200':
          description: The skill detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSkill
      summary: Edit a skill (full replace; rename supported)
      description: |
        Replaces the skill's SKILL.md wholesale (PUT semantics over
        PATCH). An included `name` renames: the directory moves to the
        new slug (no-clobber) and the frontmatter updates; a failed
        rename rolls back, and if rollback itself fails the published
        state matches disk and the retry is idempotent. Bundled files are
        preserved verbatim by every operation that keeps the skill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdate'
      responses:
        '200':
          description: The updated skill detail as now registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate target name or occupied target directory
            (`duplicate_name`), or capacity (`skill_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSkill
      summary: Delete a skill (directory including its bundle)
      description: |
        Removes the skill's whole directory, bundled files included. A
        partially failed removal publishes the on-disk state and reports
        the residual as a load error or an assets-only directory.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/providers/{name}/models/refresh:
    post:
      operationId: refreshProviderModels
      summary: Refresh one provider's models (manual)
      description: |
        Live-fetches the provider's model list, updates the catalog, and
        returns the fetched models. On failure the catalog keeps the
        previous entry. The Settings Test connection uses the same path.
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      responses:
        '200':
          description: The fetched models; the catalog is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderFailure'

  /api/chat/messages:
    get:
      operationId: syncChatMessages
      summary: Sync a session's transcript (cursor-paginated)
      description: |
        Returns transcript rows ordered by `seq`. `next_cursor` is the last
        DELIVERED sequence (a page cursor, never the database tail); page
        until `truncated` is false. The session model: `session_id` selects
        the conversation (default `default`, the quick chat).
      parameters:
        - name: session_id
          in: query
          description: The session whose transcript to sync (default
            `default`, the quick chat).
          schema:
            $ref: '#/components/schemas/Id'
        - name: after_seq
          in: query
          description: Return only rows with seq greater than this cursor.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum rows per page (1-500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of the transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSync'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendChatMessage
      summary: Send a message and get the assistant's reply
      description: |
        Appends the user message, runs one exchange against the selected
        model, and returns every row it appended in order plus the end
        cursor. The session's TYPE routes the exchange (chat = lean,
        research = the full engine pipeline, completing as a unit).
        Typed failures return the persisted user row and its cursor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSend'
      responses:
        '200':
          description: The appended rows of the exchange, in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A research run is already live in this session
            (session_busy) — extend it with continue instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/ProviderFailure'
    delete:
      operationId: clearChat
      summary: Clear a session's transcript (user-initiated, destructive)
      description: |
        Removes every message and timeline event for the named session
        (default `default`, the quick chat). The session row itself
        survives — the quick chat is never deleted.
      parameters:
        - name: session_id
          in: query
          description: The session to clear (default `default`).
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Cleared. No body.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/chat/send:
    post:
      operationId: streamChatMessage
      summary: Send a message and stream the reply (SSE)
      description: |
        Same exchange semantics as sendChatMessage, streamed over
        Server-Sent Events: zero or more `chat_delta` events (kind
        `reasoning` or `content`) stream as the model works, and the stream
        ends with exactly one terminal `chat_exchange` event — the same
        schema as the synchronous response (persisted rows in order, end
        cursor, typed error when the exchange failed). Deltas are volatile
        (never persisted, never required for replay); the terminal exchange
        is the truth. Invalid bodies or model references fail with the same
        typed 4xx JSON as the synchronous endpoint before any stream opens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSend'
      responses:
        '200':
          description: SSE event stream — chat_delta events, then one
            terminal chat_exchange.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatDelta'
                  - $ref: '#/components/schemas/ChatExchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A research run is already live in this session
            (session_busy) — extend it with continue instead. Typed JSON
            before any stream opens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/ProviderFailure'

  /v1/models:
    get:
      operationId: listOpenAiModels
      summary: OpenAI-compatible model list (the Karta session types)
      description: |
        The OpenAI-compatible channel (OpenWebUI first): advertises the
        Karta "models" — each maps to a session TYPE. `karta-research`
        runs the full pipeline (intent analysis, wards, delegation);
        `karta-chat` runs the lean exchange.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The model list (OpenAI list shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiModelList'
        '401':
          description: Missing or wrong bearer token (the OpenAI error
            shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
  /v1/chat/completions:
    post:
      operationId: openAiChatCompletion
      summary: OpenAI-compatible chat completion over Karta sessions
      description: |
        Maps an OpenAI-client conversation onto a Karta session: the
        model name selects the session type (`karta-research` /
        `karta-chat`), and the conversation's FIRST user message
        derives a stable session id (`owui-<sha1[:16]>`) so follow-up
        turns (which resend the full history) continue the same
        session. The reply is the exchange's final assistant message
        content; typed failures (busy research run, provider errors,
        unknown session state) map to the OpenAI error shape.
        With `stream: true` the response is `text/event-stream` of `chat.completion.chunk` frames terminated by `data: [DONE]` (chat sessions stream content deltas; research sessions stream the live work then the answer); otherwise JSON. The research session-busy conflict is answered as JSON before any stream opens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiCompletionRequest'
      responses:
        '200':
          description: >-
            The completion (JSON) — or, with stream=true, chunked SSE
            (chat.completion.chunk frames, [DONE] terminator).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAiCompletionResponse'
                  - $ref: '#/components/schemas/OpenAiCompletionChunk'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/OpenAiCompletionChunk'
        '400':
          description: Invalid request (the OpenAI error shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '401':
          description: Missing or wrong bearer token (the OpenAI error
            shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '409':
          description: A research run is already live in the target
            session (session_busy) — the OpenAI error shape carries
            the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '502':
          description: The exchange failed (provider failure; the
            OpenAI error shape carries the message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
        '503':
          description: The chat service is not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiError'
  /api/goals:
    post:
      operationId: createGoal
      summary: Start an autonomous goal run
      description: Creates (or reuses) a session and starts an engine run
        toward the goal. Timeline events stream on the session events
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        '201':
          description: Run started; the session is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/sessions:
    post:
      operationId: createSession
      summary: Create a research session
      description: |
        Creates a NEW research session (a shell — type `research`, no
        ward binding) and returns it. The session model: research
        sessions start empty; intent analysis moves them into wards via
        the model's own ward_use/ward_create calls. The one chat session
        (`default`) always exists and is never created here.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: The created research session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listSessions
      summary: List sessions (bounded, explicit truncation)
      parameters:
        - name: limit
          in: query
          description: Maximum number of sessions to return (1-200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous truncated
            response.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: |
            A page of sessions, most recently active first, each with
            its `type` and `ward` binding (the sidebar groups: Chat /
            Ward Bots / Research). `truncated` is true when more
            results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Read one session's identity and status
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{sessionId}/state:
    get:
      operationId: getSessionState
      summary: Read the session's state (row + latest intent analysis)
      description: |
        The session-model state surface: the session row plus the
        session's LATEST intent analysis (read from the persisted
        intent_analysis events — status, reason, primary intent,
        complexity, budget, approach, ward recommendation, provisioned
        skills/agents, dropped names). The chat surface's Task Analysis
        card and the context panel render from THIS, never by parsing
        transcript rows. Sessions without an analysis (chat sessions,
        fresh shells) carry no intent_analysis block.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/sessions/{sessionId}/leave-ward:
    post:
      operationId: leaveWard
      summary: Leave the session's ward (clear the binding)
      description: |
        Clears the session's ward binding: the session stays a
        research session and becomes a shell again (re-groups under
        Research); the engine's in-memory ward host drops the ward so
        the next run does not pre-load it. The transcript is untouched
        (history is the truth). Idempotent (204 when already unbound).
        The default chat session cannot leave (409).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Unbound (or already unbound). No body.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The default chat session has no ward binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sessions/{sessionId}/cancel:
    post:
      operationId: cancelSession
      summary: Cancel a session's active run
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session, now cancelled (or already terminal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{sessionId}/resume:
    post:
      operationId: resumeSession
      summary: Resume a waiting session with user input
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Input accepted; the run continues and streams events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/sessions/{sessionId}/continue:
    post:
      operationId: continueSession
      summary: Grant additional iterations to a live run
      description: |
        Extends a running research-mode session's step budget. The
        progress tracker consumes the grant: the hard budget extends
        and the run keeps going. Only valid while the run is active.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                additional_iterations:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 25
                  description: Additional iterations to grant.
      responses:
        '200':
          description: Extension granted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [granted]
                properties:
                  granted:
                    type: integer
                    description: Iterations actually granted.
        '409':
          description: The session has no active run to extend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sessions/{sessionId}/events:
    get:
      operationId: streamSessionEvents
      summary: Stream the session's Timeline Tree events over SSE
      description: |
        Server-Sent Events stream of timeline events for one session. Each
        SSE `data:` line carries one TimelineEvent as JSON. Replay of
        already-persisted events precedes live streaming.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/distillation:
    get:
      operationId: getDistillation
      summary: Current distillation settings (provider, model, prompt)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistillationSettings'
    put:
      operationId: putDistillation
      summary: Update distillation settings (applied without restart)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistillationSettings'
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistillationSettings'
        "400":
          description: Unknown provider or empty model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required on /v1 only when `server.api_token` is set in
        config.yaml (the OpenAI-compatible channel's opt-in remote
        posture); absent token keeps the loopback posture.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

    ProviderName:
      name: name
      in: path
      required: true
      description: The configured provider's name.
      schema:
        $ref: '#/components/schemas/Id'

    McpName:
      name: name
      in: path
      required: true
      description: |
        The MCP server's registered name (file stem). Legacy entries may
        carry broader stems than managed names allow.
      schema:
        $ref: '#/components/schemas/Id'

    SkillName:
      name: name
      in: path
      required: true
      description: The skill's frontmatter name.
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderFailure:
      description: The provider request failed (unreachable, credential
        rejected, or malformed response).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderError'
    Unauthorized:
      description: Missing or wrong bearer token (server.api_token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The session is not in a resumable (waiting) state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: The filesystem commit failed after validation
        (`io_error`); the published registry state matches disk.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

    Health:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          enum: [zbotd]
        status:
          type: string
          enum: [ok]
        version:
          type: string
          minLength: 1
          maxLength: 64

    ProviderType:
      type: string
      description: The provider connection family. Only OpenAI-compatible
        endpoints are supported today; the enum reserves the extension point.
      enum: [openai-compatible]

    ProviderOrigin:
      type: string
      description: Where the provider is declared. `file` entries live in
        `config/providers/` and are daemon-managed (editable); `config`
        entries live in the user-owned `config.yaml` (read-only via API).
      enum: [file, config]

    CredentialStatus:
      type: string
      description: Credential resolution state. `ready` — resolvable now;
        `missing` — referenced but unset or absent; `unavailable` — the
        keyring cannot be reached; `unset` — no credential reference.
      enum: [unset, ready, missing, unavailable]

    CredentialKind:
      type: string
      enum: [none, env, keyring]

    CredentialInput:
      type: object
      additionalProperties: false
      required: [kind]
      description: Explicit credential intent. `none` clears; `env`
        requires `env_name`; `keyring` requires a one-shot `key` on create
        (stored in the platform keyring, never echoed) — on edit an absent
        `key` retains the stored key.
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        env_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        key:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    ProviderCreate:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          description: Daemon-managed name; becomes the file stem.
        type:
          $ref: '#/components/schemas/ProviderType'
          default: openai-compatible
        base_url:
          type: string
          minLength: 8
          maxLength: 2048
          pattern: '^https?://'
        credential:
          $ref: '#/components/schemas/CredentialInput'

    ProviderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Absent fields keep their current values; a present
        `credential` replaces or clears the credential.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        base_url:
          type: string
          minLength: 8
          maxLength: 2048
          pattern: '^https?://'
        credential:
          $ref: '#/components/schemas/CredentialInput'

    Provider:
      type: object
      additionalProperties: false
      required: [name, type, base_url, credential_configured, origin, credential_status]
      properties:
        name:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ProviderType'
        base_url:
          type: string
          minLength: 8
          maxLength: 2048
          pattern: '^https?://'
          description: The provider's OpenAI-compatible API root, used
            verbatim (version prefix included, e.g. `http://localhost:11434/v1`).
        api_key_env:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: Environment variable NAME the daemon reads the
            credential from at request time. Absent when the provider needs
            no credential or uses the keyring.
        credential:
          type: string
          enum: [none, env, keyring]
          description: How this provider's credential is referenced (`env`
            via api_key_env; `keyring` via the api_key marker, file-declared
            providers only; `none` when absent).
        origin:
          $ref: '#/components/schemas/ProviderOrigin'
        credential_status:
          $ref: '#/components/schemas/CredentialStatus'
        credential_configured:
          type: boolean
          description: True when `credential_status` is `ready` (kept for
            compatibility; prefer `credential_status`).

    ProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Provider'

    Model:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256

    ModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/Model'

    ModelEntry:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider:
          $ref: '#/components/schemas/Id'
        id:
          type: string
          minLength: 1
          maxLength: 256

    ModelCatalog:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          maxItems: 65536
          description: Flat catalog entries; group or namespace client-side.
          items:
            $ref: '#/components/schemas/ModelEntry'
        refreshed_at:
          type: object
          description: Last successful refresh per provider (absent when
            the provider was never refreshed).
          additionalProperties:
            type: string
            format: date-time
          propertyNames:
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, seq, role, content, created_at]
      properties:
        id:
          type: string
          pattern: '^msg-[A-Za-z0-9-]{1,64}$'
        seq:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [user, assistant, tool, system, summary]
        content:
          type: string
          maxLength: 262144
        created_at:
          type: string
          format: date-time
        tool_calls:
          type: string
          description: JSON array of tool calls (assistant intent rows).
          maxLength: 65536
        tool_call_id:
          type: string
          maxLength: 128
        tool_name:
          type: string
          maxLength: 256
        provider:
          type: string
          maxLength: 128
          description: "Provenance — which provider answered (assistant rows)."
        model:
          type: string
          maxLength: 256
          description: "Provenance — which model answered (assistant rows)."
        prompt_tokens:
          type: integer
          minimum: 0
          description: REQUEST usage (bills the whole request context);
            not content size.
        completion_tokens:
          type: integer
          minimum: 0
        reasoning:
          type: string
          maxLength: 262144
          description: The model's final reasoning/thinking text
            (assistant rows from reasoning models; null when the model
            produced none).

    ChatDelta:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [reasoning, content]
          description: Which stream is being written — the model's
            thinking (reasoning) or its visible answer (content).
        text:
          type: string
          minLength: 1
          maxLength: 8192
          description: One text fragment. Fragments concatenate, in order,
            within their kind.

    ChatSend:
      type: object
      additionalProperties: false
      required: [text, model]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
        model:
          type: string
          minLength: 3
          maxLength: 384
          pattern: '^[a-z0-9][a-z0-9-]{0,63}/[\s\S]+$'
          description: Qualified selection from the picker
            (`provider/model-id`).
        session_id:
          type: string
          default: default
          description: |
            The session this exchange belongs to (an Id). The session's
            TYPE routes it: `chat` sessions run the lean pipeline,
            `research` sessions run the full engine pipeline (intent
            analysis, skills provision, ward tools, delegation, progress
            budgets). Default `default` (the quick chat). Unknown ids
            fail 404.

    ChatExchange:
      type: object
      additionalProperties: false
      required: [messages, end_cursor]
      properties:
        messages:
          type: array
          maxItems: 64
          description: Every row this exchange appended, in order.
          items:
            $ref: '#/components/schemas/ChatMessage'
        end_cursor:
          type: integer
          minimum: 0
        error:
          $ref: '#/components/schemas/ProviderError'

    ChatSync:
      type: object
      additionalProperties: false
      required: [messages, next_cursor, truncated]
      properties:
        messages:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ChatMessage'
        next_cursor:
          type: integer
          minimum: 0
          description: Last DELIVERED seq — pass back as after_seq.
        truncated:
          type: boolean

    ProviderFailureReason:
      type: string
      description: Which provider-side failure occurred.
      enum: [unreachable, unauthorized, malformed, credential_unavailable]

    ProviderError:
      type: object
      additionalProperties: false
      required: [code, message, reason]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2048
        reason:
          $ref: '#/components/schemas/ProviderFailureReason'

    SessionStatus:
      type: string
      enum: [created, running, waiting, completed, cancelled, failed]

    Session:
      type: object
      additionalProperties: false
      required: [id, type, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          description: |
            The session's TYPE — its pipeline depth, set at creation
            and immutable (the session model: no mode toggle).
          enum: [chat, research]
        status:
          $ref: '#/components/schemas/SessionStatus'
        title:
          type: string
          maxLength: 256
          description: The session's display name (research sessions).
        ward:
          type: string
          maxLength: 255
          description: The sticky ward binding (research sessions;
            absent when the session is a shell or a chat session).
        agent:
          type: string
          maxLength: 128
        run:
          type: string
          description: The session's live run state — `running` when
            an engine run is executing, absent when idle.
          enum: [running]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OpenAiModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAiModel'
    OpenAiModel:
      type: object
      additionalProperties: false
      required: [id, object]
      properties:
        id:
          type: string
          enum: [karta-research, karta-chat]
        object:
          type: string
          enum: [model]
    OpenAiCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          enum: [karta-research, karta-chat]
        messages:
          type: array
          minItems: 1
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
                maxLength: 262144
        stream:
          type: boolean
          description: |
            When true, the response is chunked SSE: `chat.completion.chunk`
            frames then a `data: [DONE]` terminator. Chat sessions stream
            real content deltas; research sessions stream the live work
            (tool/delegation/step frames as content, prefixed) and the
            final answer as the last content chunk. False/absent = JSON.
        metadata:
          type: object
          additionalProperties: false
          properties:
            chat_id:
              type: string
              minLength: 1
              maxLength: 128
              description: |
                Client-supplied stable conversation identifier — when
                present it IS the session identity (preferred over the
                first-message hash). Clients with real conversation
                ids (OpenWebUI pipelines and future builds) pass it so
                distinct conversations never share a session.
    OpenAiCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                type: object
                additionalProperties: false
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [assistant]
                  content:
                    type: string
              finish_reason:
                type: string
                enum: [stop]
    OpenAiCompletionChunk:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion.chunk]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [index, delta, finish_reason]
            properties:
              index:
                type: integer
              delta:
                type: object
                additionalProperties: false
                properties:
                  role:
                    type: string
                    enum: [assistant]
                  content:
                    type: string
              finish_reason:
                type: [string, "null"]
                enum: [stop, error, null]
                description: >-
                  Null on content chunks; `stop` on the final frame,
                  `error` on a failed run (OpenAI chunk semantics).
    OpenAiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
    SessionState:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        intent_analysis:
          $ref: '#/components/schemas/IntentAnalysisPayload'
    WardEventPayload:
      type: object
      description: |
        A ward hosting transition on a session — `ward_entered` (enter
        or switch into an existing ward) or `ward_created` (a new ward
        instantiated from an archetype). Constitution rule 4: hosting
        changes are observable, never silent.
      additionalProperties: false
      required: [ward, archetype]
      properties:
        ward:
          type: string
          maxLength: 255
          description: The ward's directory name.
        archetype:
          type: string
          maxLength: 64
        previous:
          type: string
          maxLength: 255
          description: The ward this session was hosted in before a
            switch (absent on the first entry or a creation).
        digest:
          type: string
          maxLength: 64
          description: The constitution + layout digest at entry.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Optional display name; when absent the session is titled
            later from its first exchange's intent.
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, type, status, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          description: The session's TYPE (chat = lean, research = full
            pipeline); immutable after creation.
          enum: [chat, research]
        status:
          $ref: '#/components/schemas/SessionStatus'
        title:
          type: string
          maxLength: 256
        ward:
          type: string
          maxLength: 255
          description: The sticky ward binding, when the session is
            ward-bound.
        agent:
          type: string
          maxLength: 128
        run:
          type: string
          description: The session's live run state — `running` when
            an engine run is executing (the sidebar's working badge),
            absent when idle.
          enum: [running]
        updated_at:
          type: string
          format: date-time

    SessionList:
      type: object
      additionalProperties: false
      required: [sessions, truncated]
      properties:
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SessionSummary'
        truncated:
          type: boolean
          description: True when more results exist beyond this page.
        next_cursor:
          type: string
          maxLength: 256

    GoalRequest:
      type: object
      additionalProperties: false
      required: [goal]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 16384
        session_id:
          $ref: '#/components/schemas/Id'
        agent:
          type: string
          maxLength: 128
        model:
          type: string
          minLength: 3
          maxLength: 384
          pattern: '^[a-z0-9][a-z0-9-]{0,63}/[\s\S]+$'
          description: Qualified model selection (provider/model-id);
            overrides the agent's model.
        context:
          type: array
          maxItems: 1000
          description: Prior conversation messages carried into the run
            (mirrors domain GoalRequest.Context).
          items:
            $ref: '#/components/schemas/Message'

    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 1048576
        tokens:
          type: integer
          minimum: 0

    UserInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536

    DistillationSettings:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          maxLength: 128
        model:
          type: string
          maxLength: 256
        prompt:
          type: string
          maxLength: 65536

    TimelineEventKind:
      type: string
      description: Mirrors the domain TimelineEventKind set.
      enum: [session, agent_step, delegation, tool_call, hook_decision, compaction_triggered, chitta_tool_invoked, chat_delta, intent_analysis, ward_entered, ward_created]

    TimelineEvent:
      type: object
      additionalProperties: false
      required: [id, session_id, kind, timestamp]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        parent_id:
          $ref: '#/components/schemas/Id'
        agent:
          type: string
          maxLength: 128
        kind:
          $ref: '#/components/schemas/TimelineEventKind'
        timestamp:
          type: string
          format: date-time
        text:
          type: string
          maxLength: 16384
        tool_call:
          $ref: '#/components/schemas/ToolCallPayload'
        delegation:
          $ref: '#/components/schemas/DelegationPayload'
        hook:
          $ref: '#/components/schemas/HookDecision'
        compaction:
          $ref: '#/components/schemas/CompactionStats'
        chitta_tool_invoked:
          $ref: '#/components/schemas/ChittaToolInvokedPayload'
        intent_analysis:
          $ref: '#/components/schemas/IntentAnalysisPayload'
        ward:
          $ref: '#/components/schemas/WardEventPayload'

    IntentAnalysisPayload:
      type: object
      description: One pre-execution intent analysis outcome for a root
        goal run — analyzed (with the contract summary), bypassed
        (trivial goal), or failed (non-fatal; the run proceeds).
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [analyzed, bypassed, failed]
        reason:
          type: string
          maxLength: 1024
          description: Why the analysis was bypassed or failed; absent
            for a successful analysis.
        primary_intent:
          type: string
          maxLength: 256
        complexity:
          type: string
          enum: [S, M, L, XL]
        step_budget:
          type: integer
          minimum: 1
          description: The engine step budget derived from complexity.
        approach:
          type: string
          enum: [simple, graph]
        ward_action:
          type: string
          enum: [use_existing, create_new]
        ward_name:
          type: string
          maxLength: 64
        recommended_skills:
          type: array
          description: The validated skill names provisioned for the
            run (the ## Skills section's roster).
          items:
            type: string
            maxLength: 256
        recommended_agents:
          type: array
          description: The validated agent names recommended for
            delegation.
          items:
            type: string
            maxLength: 256
        dropped:
          type: array
          description: Recommended names the runtime dropped because
            they are not in the index (drop-and-warn).
          items:
            type: string
            maxLength: 256

    ChittaToolInvokedPayload:
      type: object
      description: One chitta tool invocation (memory_* / knowledge_* tools) —
        the observable heartbeat of the chitta capability.
      additionalProperties: false
      required: [tool, outcome, affected_ids]
      properties:
        tool:
          type: string
          minLength: 1
          maxLength: 64
        outcome:
          type: string
          enum: [success, error]
        error_code:
          type: string
          enum: [invalid_input, not_found, conflict, unavailable]
        affected_ids:
          type: array
          items:
            type: string
            maxLength: 64
        provenance:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string
              enum: [agent, user, distiller]
            session_id:
              type: string
            execution_id:
              type: string
            agent_id:
              type: string
            message_seq:
              type: integer

    ToolCallPayload:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool:
          type: string
          minLength: 1
          maxLength: 256
        input:
          type: object
          additionalProperties: true
        output:
          type: string
          maxLength: 131072
        error:
          type: string
          maxLength: 16384
        duration_ms:
          type: integer
          minimum: 0

    DelegationPayload:
      type: object
      additionalProperties: false
      required: [child_agent, task]
      properties:
        child_agent:
          type: string
          minLength: 1
          maxLength: 128
        child_session_id:
          type: string
          maxLength: 128
        task:
          type: string
          minLength: 1
          maxLength: 16384

    HookAction:
      type: string
      enum: [allow, block, warn]

    HookDecision:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/HookAction'
        reason:
          type: string
          maxLength: 16384
        context:
          type: object
          additionalProperties: true

    CompactionStats:
      type: object
      additionalProperties: false
      required: [strategy, tokens_before, tokens_after, messages_before, messages_after]
      properties:
        strategy:
          type: string
          minLength: 1
          maxLength: 64
        tokens_before:
          type: integer
          minimum: 0
        tokens_after:
          type: integer
          minimum: 0
        messages_before:
          type: integer
          minimum: 0
        messages_after:
          type: integer
          minimum: 0

    # ---- MCP management -------------------------------------------------

    McpManagedName:
      type: string
      description: Name for API-created and API-renamed MCP servers
        (the manifest file stem). Existing hand-authored entries may
        carry broader stems.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'

    McpStdio:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 1024
        args:
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 1024
        env:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 4096

    McpHttp:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
          pattern: '^https?://'

    McpCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/McpManagedName'
        stdio:
          $ref: '#/components/schemas/McpStdio'
        http:
          $ref: '#/components/schemas/McpHttp'
        enabled:
          type: boolean
          description: Absent means enabled.
      description: |
        The complete manifest. At least one of `stdio` or `http` is
        required (both is valid — one entry, two transports).

    McpUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/McpManagedName'
        stdio:
          $ref: '#/components/schemas/McpStdio'
        http:
          $ref: '#/components/schemas/McpHttp'
        enabled:
          type: boolean
          description: Absent means enabled — full replace, so omitting
            the field re-enables the server.
      description: |
        Full replace of the manifest (PUT semantics). Absent `stdio` and
        `http` together is a 400. Present `name` renames.

    Mcp:
      type: object
      additionalProperties: false
      required: [name, file, transports, enabled]
      properties:
        name:
          $ref: '#/components/schemas/Id'
        file:
          type: string
          minLength: 1
          maxLength: 1024
          description: The manifest's absolute path on disk.
        enabled:
          type: boolean
          description: False when the manifest is disabled (an absent
            field means enabled). Disabled servers stay listed,
            toggleable, and probeable; future runtime wiring skips them.
        transports:
          type: array
          minItems: 1
          maxItems: 2
          description: The declared transports — stdio and/or http,
            discriminated by `kind`.
          items:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind:
                type: string
                enum: [stdio, http]
              command:
                type: string
                maxLength: 1024
                description: Present when kind is stdio.
              args:
                type: array
                maxItems: 256
                items:
                  type: string
                  maxLength: 1024
              env:
                type: object
                maxProperties: 32
                additionalProperties:
                  type: string
                  maxLength: 4096
              url:
                type: string
                maxLength: 2048
                description: Present when kind is http.

    RegistryLoadError:
      type: object
      additionalProperties: false
      required: [path, kind, message]
      properties:
        path:
          type: string
          maxLength: 1024
        kind:
          type: string
          enum: [mcp, skill]
        message:
          type: string
          maxLength: 1024

    Schedule:
      type: object
      additionalProperties: false
      required: [name, schedule, goal]
      properties:
        name:
          type: string
          maxLength: 128
        schedule:
          type: string
          maxLength: 128
          description: Cron expression (5-field or @descriptor).
        goal:
          type: string
          maxLength: 8192
        agent:
          type: string
          maxLength: 128
        model:
          type: string
          maxLength: 384
        missed_policy:
          type: string
          enum: [skip, catch_up]
        source:
          type: string
          maxLength: 1024
        next_fire:
          type: string
          format: date-time
          description: The next fire time after now.
        last_outcome:
          type: string
          enum: [fired, skipped_overlapping, skipped_missed, catch_up_fired]
          description: The scheduler's most recent decision.
        last_outcome_at:
          type: string
          format: date-time

    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name, schedule, goal]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9-]{0,127}$'
        schedule:
          type: string
          minLength: 3
          maxLength: 128
        goal:
          type: string
          minLength: 1
          maxLength: 8192
        agent:
          type: string
          maxLength: 128
        model:
          type: string
          maxLength: 384
        missed_policy:
          type: string
          enum: [skip, catch_up]

    ScheduleList:
      type: object
      additionalProperties: false
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    ScheduleDeleted:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: string

    Agent:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 2048
          description: The when-to-delegate hint; empty = not offered for
            delegation (goal-request use only).
        model:
          type: string
          maxLength: 384
          description: "Provenance — the agent's optional provider/model-id override."
        tools:
          type: array
          items:
            type: string
            maxLength: 128
          description: Tool allowlist (empty array = explicit no-tools;
            absent = all tools).
        max_depth:
          type: integer
          minimum: 0
          description: Delegation grant — the agent may spawn children
            while their depth stays below this (0 = never).
        source:
          type: string
          maxLength: 1024
          description: The definition file the registry loaded.

    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    WardList:
      type: object
      additionalProperties: false
      required: [vault_root, wards]
      properties:
        vault_root:
          type: string
          maxLength: 2048
          description: The resolved vault root (config `wards.vault_root`
            override or the OS-aware ~/Documents/wards default). Paths are
            bounded by the OS, not trimmed to fit.
        wards:
          type: array
          items:
            $ref: '#/components/schemas/WardSummary'

    WardSummary:
      type: object
      additionalProperties: false
      required: [name, archetype, lint_status, finding_count]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The ward's directory name in the vault.
        archetype:
          type: string
          maxLength: 64
          description: >-
            The conf's declared archetype; `generic` for conf-less
            freeform wards, `unknown` when the conf fails to parse.
            Convention: lowercase letters, digits, dashes.
        lint_status:
          type: string
          enum: [clean, violations]
        description:
          type: string
          maxLength: 512
          description: The .zbot/config.yaml one-liner (v2 identity).
        last_used:
          type: string
          format: date-time
          description: Last ward entry (v2 state, best-effort).
        orchestrator:
          type: string
          maxLength: 384
          description: The ward's orchestrator override ("provider/model"
            from .zbot/config.yaml) — the model that runs hosted
            sessions in this ward; absent when the ward inherits the
            daemon default.
        finding_count:
          type: integer
          minimum: 0
          description: Lint findings against the ward's conf (0 = clean).
        canonical_title:
          type: string
          maxLength: 256
          description: The canonical page's title (first level-1 heading,
            else the file name); absent when the ward has no canonical
            page yet.

    Ward:
      type: object
      additionalProperties: false
      required: [name, archetype, lint_status, finding_count, findings]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        archetype:
          type: string
          maxLength: 64
        lint_status:
          type: string
          enum: [clean, violations]
        description:
          type: string
          maxLength: 512
          description: The .zbot/config.yaml one-liner (v2 identity).
        last_used:
          type: string
          format: date-time
          description: Last ward entry (v2 state, best-effort).
        orchestrator:
          type: string
          maxLength: 384
          description: The ward's orchestrator override ("provider/model"
            from .zbot/config.yaml) — the model that runs hosted
            sessions in this ward; absent when the ward inherits the
            daemon default.
        finding_count:
          type: integer
          minimum: 0
        canonical_title:
          type: string
          maxLength: 256
        findings:
          type: array
          items:
            $ref: '#/components/schemas/WardFinding'
        layout:
          $ref: '#/components/schemas/WardNode'
          description: The parsed ward-conf.yaml layout tree; absent for
            conf-less wards and unparseable confs.

    WardFinding:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [missing_required, unexpected_entry, format_mismatch, invalid_conf]
        node_id:
          type: string
          maxLength: 512
          description: The conf node's id; absent when the finding has no
            node (unexpected entries, invalid confs). Nodes without a
            declared id are identified by their match pattern, so the
            bound matches the match-pattern limit.
        path:
          type: string
          maxLength: 1024
          description: The offending location relative to the ward root;
            for missing_required, the expected path. Pathologically deep
            paths are clamped at emit.
        message:
          type: string
          maxLength: 1024

    WardNode:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        id:
          type: string
          maxLength: 128
          description: Node id (findings and the API tree name nodes by
            it; the canonical page node uses the id `canonical`).
        kind:
          type: string
          enum: [file, directory]
        match:
          type: string
          maxLength: 256
          description: Glob match pattern for this node's entries; `{ward}`
            expands to the ward's name. Empty on the root node.
        required:
          type: boolean
          description: Default true — required nodes with no match are
            findings.
        repeat:
          type: boolean
          description: Default false — a non-repeatable node matching
            multiple entries flags the extras.
        format:
          type: string
          enum: [markdown, raw]
          description: File nodes only; markdown expects .md files,
            raw accepts any bytes.
        children:
          type: array
          items:
            $ref: '#/components/schemas/WardNode'
          description: Directory nodes only; the walk descends into each
            matched directory.

    McpList:
      type: object
      additionalProperties: false
      required: [servers]
      properties:
        servers:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Mcp'
        load_errors:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RegistryLoadError'

    McpTool:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    McpTransportTest:
      type: object
      additionalProperties: false
      required: [transport, status]
      properties:
        transport:
          type: string
          enum: [stdio, http]
        status:
          type: string
          enum: [ok, failed]
        failure:
          type: object
          additionalProperties: false
          required: [reason, message]
          properties:
            reason:
              type: string
              enum: [spawn_failed, connect_failed, timeout, protocol_error]
            message:
              type: string
              maxLength: 1024
        tools:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/McpTool'
        truncated:
          type: boolean

    McpTestResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/McpTransportTest'

    # ---- Skill marketplace ---------------------------------------------

    SkillMarketSkill:
      type: object
      additionalProperties: false
      required: [id, source, name]
      properties:
        id:
          type: string
          maxLength: 256
          description: owner/repo/skill slug from the index.
        source:
          type: string
          maxLength: 200
          description: owner/repo.
        name:
          type: string
          maxLength: 128
        installs:
          type: integer
          format: int64

    SkillMarketSearchResult:
      type: object
      additionalProperties: false
      required: [skills]
      properties:
        skills:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SkillMarketSkill'

    SkillSourceInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 3
          maxLength: 256
          description: A GitHub owner/repo, or a github.com URL form.

    SkillFileEntry:
      type: object
      additionalProperties: false
      required: [path, size]
      properties:
        path:
          type: string
          maxLength: 512
        size:
          type: integer
          format: int64
        sha256:
          type: string
          maxLength: 64
          description: Per-file content digest recorded in the preview
            capability (byte binding).
        executable:
          type: boolean

    SkillPreviewPayload:
      type: object
      additionalProperties: false
      required: [name, description, body, files]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        body:
          type: string
          maxLength: 262144
        files:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/SkillFileEntry'
        license:
          type: string
          maxLength: 64

    SkillRepoPreview:
      type: object
      additionalProperties: false
      required: [source, commit, capability, skills]
      properties:
        source:
          type: string
          maxLength: 200
        commit:
          type: string
          maxLength: 64
          description: The immutable commit the preview pinned.
        capability:
          type: string
          maxLength: 512
          description: Opaque install capability; expires with the
            preview cache (15 minutes).
        skills:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SkillPreviewPayload'

    SkillInstallRequest:
      type: object
      additionalProperties: false
      required: [capability, skills]
      properties:
        capability:
          type: string
          minLength: 16
          maxLength: 512
        skills:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            maxLength: 128
          description: The chosen skill names from the preview.

    SkillInstallStatus:
      type: string
      enum: [created, skipped, failed]

    SkillInstallOutcome:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          maxLength: 128
          description: The stored directory name when created.
        status:
          $ref: '#/components/schemas/SkillInstallStatus'
        reason:
          type: string
          enum: [duplicate, invalid_skill, capacity, io_error]
        message:
          type: string
          maxLength: 1024
        origin:
          type: string
          enum: [marketplace, import, local]

    SkillInstallResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SkillInstallOutcome'

    SkillArchivePreview:
      type: object
      additionalProperties: false
      required: [stagingId, skill]
      properties:
        stagingId:
          type: string
          minLength: 32
          maxLength: 128
          description: Opaque one-shot bearer capability for commit.
        skill:
          $ref: '#/components/schemas/SkillPreviewPayload'

    SkillImportCommitRequest:
      type: object
      additionalProperties: false
      required: [stagingId]
      properties:
        stagingId:
          type: string
          minLength: 32
          maxLength: 128

    # ---- MCP import --------------------------------------------------

    McpImportRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: string
          maxLength: 262144
          description: The pasted configuration as raw text. The daemon
            is the only parser — never send pre-parsed JSON objects
            (they lose key order, duplicate keys, and number fidelity).
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Name for single-object pastes (the object itself
            carries no key).
        replaceName:
          type: string
          minLength: 1
          maxLength: 128
          description: Edit-as-JSON — replace this existing server's
            transports with the document's exactly-one entry (name
            unchanged).

    McpImportOutcomeReason:
      type: string
      description: Why an entry skipped or failed. Skips — duplicate,
        disabled, other_os. Failures — shape, field, name, capacity,
        io_error.
      enum: [duplicate, disabled, other_os, shape, field, name, capacity, io_error]

    McpImportOutcome:
      type: object
      additionalProperties: false
      required: [source_key, status]
      properties:
        source_key:
          type: string
          maxLength: 256
          description: The original JSON key the entry came from.
        name:
          type: string
          maxLength: 128
          description: The stored name, when the entry was created (or
            replaced); includes slug normalization from the key.
        status:
          type: string
          enum: [created, skipped, failed]
        reason:
          $ref: '#/components/schemas/McpImportOutcomeReason'
        message:
          type: string
          maxLength: 1024
        warnings:
          type: array
          maxItems: 32
          description: Tolerance report — ignored foreign keys (named,
            values never echoed), coercions, deprecations.
          items:
            type: string
            maxLength: 1024

    McpImportResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 32
          description: One outcome per entry, in paste order.
          items:
            $ref: '#/components/schemas/McpImportOutcome'

    # ---- Skill management ------------------------------------------------

    Skill:
      type: object
      additionalProperties: false
      required: [name, description, directory, origin]
      properties:
        name:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 1
          maxLength: 512
        directory:
          type: string
          minLength: 1
          maxLength: 1024
          description: The skill directory's absolute path on disk.
        origin:
          type: string
          enum: [local, marketplace, import]
        source:
          type: string
          maxLength: 200
          description: owner/repo for marketplace skills when recorded.
        ref:
          type: string
          maxLength: 200
          description: The recorded branch/ref for marketplace skills.

    SkillDetail:
      type: object
      additionalProperties: false
      required: [name, description, directory, body, origin]
      properties:
        name:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 1
          maxLength: 512
        directory:
          type: string
          minLength: 1
          maxLength: 1024
        body:
          type: string
          maxLength: 262144
        origin:
          type: string
          enum: [local, marketplace, import]
        source:
          type: string
          maxLength: 200
          description: owner/repo for marketplace skills when recorded.

    SkillCreate:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: The skill name; the directory slug is derived from
            it (lowercase, `[a-z0-9-]`).
        description:
          type: string
          minLength: 1
          maxLength: 512
        body:
          type: string
          maxLength: 262144
          default: ''

    SkillUpdate:
      type: object
      additionalProperties: false
      required: [description, body]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Present to rename (the directory moves to the new
            slug and the frontmatter updates).
        description:
          type: string
          minLength: 1
          maxLength: 512
        body:
          type: string
          maxLength: 262144
          description: The complete replacement body (PUT semantics —
            send the current body for a frontmatter-only edit).

    SkillList:
      type: object
      additionalProperties: false
      required: [skills]
      properties:
        skills:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/Skill'
        load_errors:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RegistryLoadError'

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 2048
        session_id:
          $ref: '#/components/schemas/Id'
